[package]
name = "invoicer"
version = "0.1.0"
edition = "2021"
description = "Invoice PDF parser and SEPA EPC QR code generator for Revolut and European banking apps"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde-wasm-bindgen = "0.6"
serde_json = "1.0"
lopdf = { version = "0.34", features = ["nom_parser"] }
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
regex = "1.10"
thiserror = "2.0"
console_error_panic_hook = { version = "0.1", optional = true }

[dev-dependencies]
wasm-bindgen-test = "0.3"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
